[package]
name = "payofflab"
version = "1.1.0"
description = "PayoffLab — 中文期权策略工作台"
authors = ["PayoffLab"]
edition = "2021"

[lib]
name = "payofflab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
