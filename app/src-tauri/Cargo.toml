[package]
name = "payoff-chart"
version = "1.0.0"
description = "期权盈亏图 — 中文期权策略工作台"
authors = ["期权盈亏图"]
edition = "2021"

[lib]
name = "payoff_chart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
