[package]
name = "quantu"
version = "1.0.1"
description = "权图 — 中文期权策略工作台"
authors = ["权图"]
edition = "2021"

[lib]
name = "quantu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
